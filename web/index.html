<div id="app"></div>
<div id="hud">
  <div id="clock" class="txt"><svg class="dial" viewBox="0 0 32 32"></svg><span></span></div>
  <div id="topbtns">
    <button class="ibtn" id="bSound" data-i18n-title="btn.sound"><span class="k">M</span></button>
    <button class="ibtn" id="bHelp" data-i18n-title="btn.help"><span class="k">H</span></button>
    <button class="ibtn" id="bView" data-i18n-title="btn.view"><span class="k">V</span></button>
    <button class="ibtn" id="bFull" data-i18n-title="btn.full"></button>
    <button class="ibtn" id="bMenu" data-i18n-title="btn.settings"><span class="k">Esc</span></button>
  </div>
  <div id="help" class="txt"></div>
  <div id="status" class="txt"></div>
  <div id="prompt" class="txt"></div>
  <div id="toast" class="txt"></div>
  <div id="charge"><div></div></div>
  <div id="wobble"><div></div></div>
  <div id="abilities"></div>
  <div id="fps" class="txt"></div>
  <div id="bob" class="txt"></div>
  <div id="bobmark" class="txt"></div>
  <div id="clickHint" class="txt" data-i18n="hud.click">Click to keep playing</div>
</div>
<div id="admin" class="txt"></div>
<div id="menu" class="overlay"><div class="panel txt" id="menuPanel"></div></div>
<div id="lobby" class="overlay"></div>
<div id="wardrobe" class="overlay"><div class="panel txt">
  <div id="wPreview"></div>
  <div id="wSide">
    <div id="wHead"><h2 data-i18n="w.title">Wardrobe</h2><div id="wWallet" class="wallet"></div></div>
    <div id="wTabs"></div>
    <div id="wItems"></div>
    <div id="wBottom"><div id="wBuy"></div><button class="chip" id="wRandom" data-i18n="w.random">Surprise me!</button><button class="chip" id="wDone" data-i18n="w.done">Done</button></div>
  </div>
</div></div>
<div id="title">
  <div id="loadBox">
    <h1>PORKOUR</h1>
    <div class="sub txt" data-i18n="title.sub">Four pigs. One farmer. Zero shame.</div>
    <div id="bar"><div></div></div>
    <div class="go txt" id="go" data-i18n="title.loading">Loading…</div>
  </div>
  <div id="lobbyUI" class="txt">
    <header id="lTop">
      <div class="logo">PORKOUR</div>
      <nav id="lTabs">
        <button class="on" data-t="play"><span data-i18n="lobby.tabPlay">Play</span></button>
        <button data-t="wardrobe"><span data-i18n="lobby.tabWardrobe">Wardrobe</span></button>
        <button data-t="shop"><span data-i18n="lobby.tabShop">Shop</span></button>
        <button data-t="online" id="tOnline"><span data-i18n="lobby.tabOnline">Online</span></button>
      </nav>
      <div class="lRight"><div id="tWallet" class="wallet"></div>
        <button class="ibtn" id="lSound"></button><button class="ibtn" id="lFull" data-i18n-title="btn.full"></button><button class="ibtn" id="lSet" data-i18n-title="btn.settings"></button></div>
    </header>
    <aside id="lParty"></aside>
    <div id="lKeys"></div>
    <div id="lPlayBox"><div id="lFarm" class="farmCard"></div><button id="lPlay" class="playBtn">PLAY</button></div>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
